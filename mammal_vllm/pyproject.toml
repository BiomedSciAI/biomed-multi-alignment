[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mammal_vllm"
version = "0.1.0"
description = "vLLM plugin for IBM MAMMAL biomedical foundation model"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "vllm>=0.26.0",
    "torch>=2.0.0",
    "transformers>=5,<6",
    "biomed-multi-alignment",
]

[project.optional-dependencies]
mammal = ["biomed-multi-alignment"]
dev    = ["pytest>=7.0", "pytest-xdist", "pre-commit"]

[project.entry-points."vllm.general_plugins"]
mammal = "vllm_mammal_plugin:register_mammal_model"

[project.urls]
Homepage   = "https://huggingface.co/ibm-research/biomed.omics.bl.sm.ma-ted-458m"
Repository = "https://github.com/BiomedSciAI/biomed-multi-alignment"
Issues     = "https://github.com/vllm-project/vllm/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gpu: mark test as requiring a CUDA-capable GPU (skipped when torch.cuda.is_available() is False)",
]
